<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow · Remote</title><link rel="stylesheet" href="remote.css"></head><body><main><header><span class="mark">F↓</span><div><h1>Flow</h1><p>Downloads, wherever you sit.</p></div><button id="signout" hidden>Disconnect</button></header><section id="pair"><h2>Connect to your computer</h2><p>Enter the six-digit code shown in Flow → Tools → Send from your phone.</p><form id="pair-form"><label for="pin">Pairing code</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button>Connect</button></form></section><section id="connected" hidden><form id="add-form"><label for="url">What would you like to download?</label><input id="url" type="url" placeholder="Paste a file or video link" required><button>Download on my computer</button></form><h2>Your downloads</h2><div id="downloads"></div></section><p id="message" role="status"></p><footer>Flow Download Manager · mohamed abdelnaby</footer></main><script src="remote.js"></script></body></html>
