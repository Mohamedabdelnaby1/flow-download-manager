<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Flow Companion</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="material.css"></head><body><header><strong>Flow <span>Companion</span></strong><button id="options" class="secondary">Settings</button></header><div id="connection" class="connection" role="status">Checking connection…</div><form id="send-link" class="send-card"><label for="download-url">Download a link</label><div class="url-row"><input id="download-url" type="url" placeholder="Paste a file, video or playlist URL" required><button type="submit">Send</button></div><div class="quality-row"><select id="quick-quality" aria-label="Video quality"><option value="best">Best video</option><option value="max1080">Up to 1080p</option><option value="max720">Up to 720p</option><option value="audio">Audio only · MP3</option></select><button type="button" id="current-video" class="secondary" hidden>This video</button></div></form><label class="check capture"><input id="auto-capture" type="checkbox"> Capture browser downloads</label><small id="capture-state"></small><div class="media-heading"><strong>On this page</strong><button id="refresh-media" class="secondary" aria-label="Refresh discovered media">Refresh</button></div><input id="media-search" type="search" aria-label="Filter discovered media" placeholder="Search discovered media"><div id="list"></div><small id="message" role="status" aria-live="polite"></small><details id="site-controls"><summary>Controls for this site</summary><label class="check"><input id="site-capture" type="checkbox"> Capture downloads on this site</label><label class="check"><input id="site-panel" type="checkbox"> Show video button on this site</label><div class="capture-tools"><button id="capture-snooze" class="secondary">Pause for 15 min</button><button id="capture-resume" class="secondary">Resume capture</button></div><button id="clear-media" class="secondary">Clear discovered media</button><button id="reset-panel" class="secondary">Reset video button</button></details><footer><button id="sync" class="secondary">Test connection</button><button id="links" class="secondary">Page links</button><button id="diagnostics" class="secondary">Diagnostics</button></footer><details id="diagnostic-output" hidden><summary>Connection report</summary><textarea id="diagnostic-text" readonly aria-label="Connection diagnostic report"></textarea></details><p class="hint">Alt + click keeps a link in the browser. Right-click → Download with Flow.</p><script src="media-model.js"></script><script src="error-model.js"></script><script src="error-view.js"></script><script src="appearance.js"></script><script src="popup.js"></script></body></html>
