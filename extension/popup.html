<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Flow Companion</title><link rel="stylesheet" href="material.css"><link rel="stylesheet" href="popup.css"></head><body class="companion-popup">
<header class="companion-header"><div class="brand"><span class="brand-mark" aria-hidden="true">F<small>↘</small></span><div><strong>Flow</strong><small>Companion</small></div></div><button id="options" class="icon-button secondary" aria-label="Companion settings" title="Settings">⚙</button></header>
<div class="connection-row"><div id="connection" class="connection" role="status">Checking connection…</div><button id="sync" class="text-button" hidden>Reconnect</button></div>
<main><form id="send-link" class="send-card"><label for="download-url">Add a download</label><div class="url-row"><input id="download-url" type="url" placeholder="Paste a file, video or playlist link" required><button type="submit" aria-label="Send link to Flow" title="Send to Flow">→</button></div><div class="quality-row"><label for="quick-quality">Video preference</label><select id="quick-quality"><option value="best">Best video</option><option value="max1080">Up to 1080p</option><option value="max720">Up to 720p</option><option value="audio">Audio only · MP3</option></select></div><button type="button" id="current-video" class="current-video" hidden>This video</button></form>

<section class="page-media"><div class="media-heading"><div><h2>Media on this page <span id="source-count" class="count-badge">0</span></h2></div><button id="refresh-media" class="secondary icon-button" aria-label="Refresh discovered media" title="Refresh">↻</button></div><input id="media-search" type="search" aria-label="Filter discovered media" placeholder="Find a video or audio source"><div id="list" aria-live="polite"></div></section><small id="message" role="status" aria-live="polite"></small>
<details id="site-controls" class="site-controls"><summary>Options for this site</summary><section class="capture-card"><label class="switch-row"><span><strong>Catch browser downloads</strong><small>Send new files straight to Flow</small></span><input id="auto-capture" type="checkbox" role="switch"></label><small id="capture-state"></small></section><label class="switch-row"><span>Capture downloads here</span><input id="site-capture" type="checkbox" role="switch"></label><label class="switch-row"><span>Show the video button</span><input id="site-panel" type="checkbox" role="switch"></label><div class="capture-tools"><button id="capture-snooze" class="secondary">Pause 15 min</button><button id="capture-resume" class="secondary">Resume</button></div><div class="site-actions"><button id="reset-panel" class="text-button">Reset video button</button><button id="clear-media" class="text-button">Clear sources</button></div></details><details id="diagnostic-output" hidden><summary>Connection report</summary><textarea id="diagnostic-text" readonly aria-label="Connection diagnostic report"></textarea></details>
</main><footer><button id="links" class="text-button">Collect page links ↗</button><button id="diagnostics" class="text-button">Connection help</button></footer><script src="media-model.js"></script><script src="error-model.js"></script><script src="error-view.js"></script><script src="appearance.js"></script><script src="popup.js"></script></body></html>
