<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
 <title id="title">Flow Download Manager. Less friction. More flow.</title>
 <desc id="desc">A free, open-source Windows workspace for downloads. Created by mohamed abdelnaby. An abstract network of mint, lavender and amber paths represents capture, organization and continuation.</desc>
 <defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f3f7f3"/><stop offset="1" stop-color="#e9f0ef"/></linearGradient>
  <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#addcc8"/><stop offset="1" stop-color="#80bbaa"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#426958" opacity=".10"/></pattern>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dy="12" stdDeviation="18" flood-color="#284b3b" flood-opacity=".07"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="m1 1 3 2-3 2" fill="none" stroke="#4d8673" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
 </defs>
 <rect width="1500" height="680" rx="32" fill="url(#paper)"/>
 <path d="M920-100c-130 250-90 420 165 520s280 100 510 270" stroke="#dce9e1" stroke-width="130" fill="none" opacity=".5"/>
 <rect x="730" y="130" width="700" height="450" fill="url(#grid)"/>
 <g font-family="Segoe UI,Arial,sans-serif">
  <g transform="translate(84 52)"><rect width="58" height="58" rx="18" fill="#397e6d"/><path d="M18 15h25v8H26v7h13v8H26v10h-8z" fill="#fff"/><path d="m35 40 8 8 8-8" fill="none" stroke="#c2e8d7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="159" y="92" font-size="38" font-weight="700" fill="#263d34" letter-spacing="-1.3">Flow</text>
  <text x="263" y="90" font-size="18" fill="#70847a">Download Manager</text>
  <rect x="1228" y="64" width="184" height="34" rx="17" fill="#e0e9e2"/>
  <circle cx="1249" cy="81" r="4" fill="#397e6d"/><text x="1264" y="87" fill="#426452" font-size="12" font-weight="600" letter-spacing="1.4">OPEN SOURCE · 2.7</text>
  <text x="86" y="204" font-size="13" font-weight="600" fill="#4f7a65" letter-spacing="3.6">YOUR FILES. YOUR WORKSPACE.</text>
  <text x="80" y="314" font-size="96" font-weight="700" fill="#243d32" letter-spacing="-5">Less friction.</text>
  <text x="80" y="414" font-size="96" font-weight="700" fill="#397e6d" letter-spacing="-5">More flow.</text>
  <text x="86" y="469" font-size="22" fill="#60786b">Capture the link. Make it yours.</text>
  <text x="86" y="502" font-size="22" fill="#60786b">Keep everything moving.</text>
  <g transform="translate(86 542)"><rect width="157" height="33" rx="16.5" fill="#dfeae2"/><text x="18" y="22" font-size="12" font-weight="600" fill="#446551" letter-spacing="1">FREE TO USE</text><rect x="168" width="136" height="33" rx="16.5" fill="#e5e4ef"/><text x="186" y="22" font-size="12" font-weight="600" fill="#71648e" letter-spacing="1">MIT SOURCE</text><rect x="315" width="138" height="33" rx="16.5" fill="#ede7da"/><text x="333" y="22" font-size="12" font-weight="600" fill="#8d784b" letter-spacing="1">WINDOWS X64</text></g>
  <g fill="none" stroke-linecap="round" stroke-width="3">
   <path d="M903 238v38q0 32 32 32h94q32 0 32 32v12" stroke="#92bda8" marker-end="url(#arrow)"/>
   <path d="M1262 255v25q0 28-28 28h-72q-30 0-30 30v14" stroke="#b9a8ce"/>
   <path d="M1100 430v29q0 35-35 35H913q-30 0-30 30" stroke="#84b5a5"/>
   <path d="M1140 430v23q0 20 20 20h118q25 0 25 25v26" stroke="#c9b480"/>
  </g>
  <g transform="translate(785 168)" filter="url(#shadow)"><rect width="236" height="81" rx="22" fill="#fff"/><rect x="18" y="18" width="46" height="46" rx="15" fill="#e0eee6"/><g fill="none" stroke="#4d8771" stroke-width="2"><circle cx="41" cy="41" r="13"/><path d="M28 41h26m-13-13c-8 9-8 18 0 26 8-8 8-17 0-26"/></g><text x="82" y="35" fill="#7a8e82" font-size="10" letter-spacing="2">01 / CAPTURE</text><text x="82" y="58" fill="#365344" font-size="16" font-weight="600">From your browser</text></g>
  <g transform="translate(1168 180) rotate(4 98 37)" filter="url(#shadow)"><rect width="206" height="75" rx="22" fill="#f5f0f9"/><circle cx="37" cy="38" r="18" fill="#e8dff0"/><path d="M28 33h8m-8 10h16m-4-15 8 8-8 8" fill="none" stroke="#9481ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="33" fill="#a18bb4" font-size="10" letter-spacing="1.5">02 / ORGANIZE</text><text x="68" y="55" fill="#6c5b80" font-size="17" font-weight="600">Your rules</text></g>
  <g transform="translate(1015 335)" filter="url(#shadow)"><rect width="154" height="110" rx="30" fill="url(#mint)"/><path d="M1069 355h44v13h-28v10h22v13h-22v20h-16z" transform="translate(-1015 -335)" fill="#285b47"/><path d="m1098 396 13 13 13-13" transform="translate(-1015 -335)" fill="none" stroke="#e6f7ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(769 514) rotate(-3 140 41)" filter="url(#shadow)"><rect width="288" height="86" rx="22" fill="#fff"/><rect x="18" y="19" width="48" height="48" rx="15" fill="#e3eeea"/><path d="m36 32 16 11-16 11z" fill="none" stroke="#5c917e" stroke-width="2" stroke-linejoin="round"/><text x="83" y="35" fill="#4c6758" font-size="15" font-weight="600">A calmer download</text><rect x="83" y="51" width="180" height="5" rx="2.5" fill="#e5ede7"/><rect x="83" y="51" width="124" height="5" rx="2.5" fill="#8bbba5"/><text x="83" y="74" fill="#859b8c" font-size="10" letter-spacing="1.1">03 / CONTINUE YOUR WAY</text></g>
  <g transform="translate(1205 519) rotate(3 95 39)" filter="url(#shadow)"><rect width="196" height="78" rx="21" fill="#f6f0e3"/><circle cx="37" cy="39" r="18" fill="#e9dcba"/><path d="m29 39 6 6 11-13" fill="none" stroke="#9e8755" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="35" fill="#8b7951" font-size="14" font-weight="600">Under control</text><text x="68" y="55" fill="#a6936a" font-size="11">Always your choice</text></g>
  <path d="M84 622h1328" stroke="#d5e1d9"/>
  <text x="86" y="651" font-size="11" font-weight="600" letter-spacing="2" fill="#6c8475">DESIGNED &amp; BUILT BY MOHAMED ABDELNABY</text>
  <text x="1412" y="651" text-anchor="end" font-size="12" fill="#7d9386">A local-first desktop workspace.</text>
 </g>
</svg>
