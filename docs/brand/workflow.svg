<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="226" viewBox="0 0 1500 226" role="img" aria-labelledby="title"><title id="title">Capture. Choose. Carry on.</title><rect width="1500" height="226" rx="28" fill="#1e3029"/><g font-family="Segoe UI,Arial,sans-serif"><path d="M500 46v134m500-134v134" stroke="#3b4b42"/><g fill="#a7cdb9" font-size="13" letter-spacing="2"><text x="50" y="60">01 / CAPTURE</text><text x="550" y="60">02 / CHOOSE</text><text x="1050" y="60">03 / CARRY ON</text></g><g fill="#edf4ed" font-size="28" font-weight="600"><text x="50" y="104">A link is all you need.</text><text x="550" y="104">Your pace. Your place.</text><text x="1050" y="104">Let Flow handle the queue.</text></g><g fill="#9db3a4" font-size="17"><text x="50" y="146">Paste a URL or send it from your browser.</text><text x="550" y="146">Pick quality, destination and transfer limits.</text><text x="1050" y="146">Minimize, resume and keep things organized.</text></g><g fill="none" stroke="#82b29b" stroke-width="2" stroke-linecap="round"><path d="M52 184h54m-7-5 7 5-7 5M552 184h54m-7-5 7 5-7 5M1052 184h54m-7-5 7 5-7 5"/></g></g></svg>
